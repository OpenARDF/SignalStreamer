<text x="43" y="732" font-size="19" font-weight="700">Datums and workmanship</text>
<text x="43" y="759" font-size="15" font-weight="400">X is along the length toward BNC. Z is across the width toward the tube. Y is toward the cover. Y 0 is the stock STEP parting plane.</text>
<text x="43" y="783" font-size="15" font-weight="400">X 0 and Z 0 pass through the center of the four PCB bosses. Cover bores run parallel to Y. B, T, W2 and W3 cross the seam. W4 is in the base.</text>
<text x="43" y="807" font-size="15" font-weight="400">Reuse Polycase J-29441AC / J-29441AB Rev 0 hole finish and three-decimal inch tolerance for P and B. P and B center locations ±0.127 mm per axis.</text>
<text x="43" y="831" font-size="15" font-weight="400">Wire hole center locations ±0.30 mm. Remove burrs. Keep the press-fit bore and entry treatment as supplied on J-29441A. Inspect with the enclosure assembled.</text>
